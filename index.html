<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售订单管理台账</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --border:#e4e9f0; --text:#1f2937; --muted:#6b7280;
    --primary:#3b82f6; --primary-dark:#2563eb; --primary-light:#eff6ff;
    --danger:#ef4444; --danger-light:#fef2f2;
    --warn:#f59e0b; --warn-light:#fffbeb;
    --success:#10b981; --success-light:#ecfdf5;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  .container{max-width:1440px;margin:0 auto;padding:20px 16px 60px}

  /* ===== 顶部 ===== */
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  header h1{font-size:18px;font-weight:500;display:flex;align-items:center;gap:0}
  header h1 .logo-img{height:36px;width:auto;max-width:180px;object-fit:contain;display:block}
  header h1 .logo-divider{width:1px;height:26px;background:#d1d5db;margin:0 12px}
  header h1 .app-title{color:#111827;white-space:nowrap}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ===== 统计卡片 ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s, box-shadow .15s}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .stat-card.active{outline:2px solid var(--primary)}
  .stat-card .num{font-size:26px;font-weight:700}
  .stat-card .label{color:var(--muted);font-size:13px;margin-top:2px}
  .stat-card.c-all .num{color:var(--primary)}
  .stat-card.c-todo .num{color:#8b5cf6}
  .stat-card.c-doing .num{color:var(--warn)}
  .stat-card.c-done .num{color:var(--success)}
  .stat-card.c-soon .num{color:#f97316}
  .stat-card.c-overdue .num{color:var(--danger)}

  /* ===== 工具栏 ===== */
  .toolbar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar input[type=text],.toolbar select,.toolbar input[type=date]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;color:var(--text);outline:none}
  .toolbar input[type=text]:focus,.toolbar select:focus{border-color:var(--primary)}
  .toolbar input[type=text]{flex:1;min-width:160px}
  .toolbar label{color:var(--muted);font-size:12px}

  /* ===== 按钮 ===== */
  .btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fecaca}
  .btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}

  /* ===== 分组与表格 ===== */
  .group-block{margin-bottom:18px}
  .group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:15px}
  .group-header .count{background:var(--primary-light);color:var(--primary-dark);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
  .group-header .gdone{color:var(--muted);font-size:12px;font-weight:400}
  .task-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .task-table th{background:#f8fafc;text-align:center;padding:9px 12px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
  .task-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  .task-table tr:last-child td{border-bottom:none}
  .task-table tbody tr{transition:background .12s;cursor:pointer}
  .task-table tbody tr:hover{background:#f8fafc}
  tr.row-overdue{background:var(--danger-light)!important;box-shadow:inset 3px 0 0 var(--danger)}
  tr.row-soon{background:var(--warn-light)!important;box-shadow:inset 3px 0 0 var(--warn)}
  tr.row-done .task-title{text-decoration:line-through;color:var(--muted)}
  .task-title{font-weight:600;font-size:14px}
  .task-desc{color:var(--muted);font-size:12px;margin-top:2px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .desc-cell{color:var(--muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ord-cell{font-size:12.5px;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ord-code{font-weight:600;color:#0f766e}
  .ord-none{color:#9ca3af}
  .due-cell{white-space:nowrap;font-size:13px}
  .due-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600}
  .due-tag.overdue{background:var(--danger);color:#fff}
  .due-tag.soon{background:var(--warn);color:#fff}
  .due-tag.today{background:#f97316;color:#fff}

  /* 徽章 */
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .p-high{background:#fee2e2;color:#b91c1c}.p-high .dot{background:#ef4444}
  .p-mid{background:#fef3c7;color:#b45309}.p-mid .dot{background:#f59e0b}
  .p-low{background:#e0f2fe;color:#0369a1}.p-low .dot{background:#0ea5e9}
  .s-todo{background:#ede9fe;color:#6d28d9}.s-todo .dot{background:#8b5cf6}
  .s-doing{background:#fef3c7;color:#b45309}.s-doing .dot{background:#f59e0b}
  .s-done{background:#d1fae5;color:#047857}.s-done .dot{background:#10b981}
  .cat-badge{background:#f1f5f9;color:#475569;padding:2px 10px;border-radius:6px;font-size:12px;white-space:nowrap}
  .pending-badge{background:var(--danger);color:#fff;margin-left:4px;padding:0 7px;border-radius:99px;font-size:11px}

  /* 状态快捷切换 */
  .status-select{padding:3px 6px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:#fff;cursor:pointer}
  .pri-select{padding:3px 6px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:#fff;cursor:pointer;font-weight:600}
  .pri-select.p-high{color:var(--danger)} .pri-select.p-mid{color:#f97316} .pri-select.p-low{color:#16a34a}
  /* 圆形字母优先级徽标：高=亮红(H) / 中=亮黄(M) / 低=绿(L)，白字 */
  /* 圆形字母优先级徽标（扁平实心） */
  .pri-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;box-sizing:border-box;border-radius:50%;color:#fff;font-weight:800;font-size:13px;line-height:1;cursor:pointer;user-select:none;transition:transform .08s}
  .pri-badge:active{transform:translateY(1px) scale(.94)}
  .pri-badge.p-high{background:#ef4444}
  .pri-badge.p-mid{background:#f5b400}
  .pri-badge.p-low{background:#22c55e}
  .date-input{padding:3px 6px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:#fff;cursor:pointer;font-family:inherit}
  .date-input.date-overdue{border-color:var(--danger);background:#fef2f2;color:var(--danger);font-weight:600}
  .date-input.date-today{border-color:#f97316;background:#fff7ed;color:#f97316;font-weight:600}
  .remind-badge{background:var(--danger);color:#fff;margin-left:4px;padding:0 7px;border-radius:99px;font-size:11px}

  .empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .icon{font-size:40px;margin-bottom:10px}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-head h3{font-size:16px}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
  .modal-body{padding:18px 20px}
  .form-row{display:flex;gap:12px}
  .form-group{margin-bottom:14px;flex:1}
  .form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .form-group label .req{color:var(--danger)}
  /* 新增事务：大类选择器 */
  .cat-chooser{display:flex;gap:10px}
  .cat-opt{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .12s}
  .cat-opt:hover{border-color:#94a3b8}
  .cat-opt.active{border-color:var(--primary);background:#eef4ff;color:var(--primary)}
  .ord-fields{border:1px dashed var(--border);border-radius:10px;padding:12px 12px 2px;margin-bottom:4px;background:#fafbfc}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .form-group textarea{resize:vertical;min-height:64px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

  /* ===== 详情/时间轴 ===== */
  .detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .detail-desc{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:#374151;margin-bottom:16px;white-space:pre-wrap}
  .timeline{position:relative;padding-left:20px;max-height:300px;overflow-y:auto}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .tl-item{position:relative;padding:0 0 14px 12px}
  .tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
  .tl-item.tl-create::before{border-color:var(--success)}
  .tl-item.tl-status::before{border-color:var(--warn)}
  .tl-item.tl-note::before{border-color:var(--primary)}
  .tl-time{font-size:11px;color:var(--muted)}
  .tl-text{font-size:13px;margin-top:1px}
  .tl-note-input{display:flex;gap:8px;margin-top:10px}
  .tl-note-input input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}

  /* toast */
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:9px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 审核列表 */
  .audit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
  .audit-row span{font-size:13px;word-break:break-all}

  /* 账号管理 */
  .modal.modal-wide{max-width:840px}
  .um-table{width:100%;border-collapse:collapse;font-size:13px}
  .um-table th{text-align:left;padding:8px 10px;background:#f8fafc;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
  .um-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .um-table tr:last-child td{border-bottom:none}
  .um-mail{word-break:break-all;font-weight:500}
  .um-tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;white-space:nowrap}
  .um-tag.ok{background:#dcfce7;color:#166534}
  .um-tag.wait{background:#fef3c7;color:#92400e}
  .um-tag.stop{background:#fee2e2;color:#991b1b}
  .um-tag.founder{background:#ede9fe;color:#5b21b6}
  .um-tag.user{background:#e0f2fe;color:#075985}
  .um-tag.online{background:#dcfce7;color:#166534}
  .um-ops{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .um-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
  .um-sum b{color:var(--text);font-size:14px}
  @media (max-width:720px){ .um-table .um-hide{display:none} }

  @media (max-width:720px){
    .task-table .hide-sm{display:none}
    .form-row{flex-direction:column;gap:0}
  }
  /* ===== 登录 ===== */
  #app.hidden{display:none}
  .login-mask{position:fixed;inset:0;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
  .login-mask.hidden{display:none}
  .login-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
  .login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:28px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
  .login-card h2{font-size:19px;margin-bottom:4px}
  .login-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .login-card input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box}
  .login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .login-btn{width:100%;justify-content:center;margin-bottom:10px}
  .login-err{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:6px}
  .login-hint{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
  .cur-user{font-size:13px;color:var(--muted);background:var(--primary-light);padding:5px 10px;border-radius:99px;margin-right:2px}
</style>
</head>

    <div class="header-actions">
      <button class="btn btn-outline btn-sm" id="btnRemind" onclick="openReminders()" title="待回顾提醒（点击筛选 + 桌面通知）">🔔 待回顾 <span class="remind-badge" id="remindCount">0</span></button>
      <span class="cur-user" id="curUser"></span>
      <button class="btn btn-outline btn-sm" id="btnAudit" style="display:none" onclick="openAudit()">🛡 审核注册 <span class="pending-badge" id="auditCount" style="display:none">0</span></button>
      <button class="btn btn-outline btn-sm" id="btnUsers" style="display:none" onclick="openUsers()">👥 账号管理</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
      <button class="btn btn-outline" onclick="exportData()">⬇ 导出数据</button>
      <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">⬆ 导入数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-primary" onclick="openEditModal()">＋ 新增事务</button>
    </div>
  </header>

  <!-- 统计卡片（点击可筛选） -->
  <div class="stats" id="stats"></div>

  <!-- 筛选工具栏 -->
  <div class="toolbar">
    <input type="text" id="fSearch" placeholder="🔍 搜索标题 / 描述 / 分类…" oninput="render()">
    <select id="fStatus" onchange="render()">
      <option value="">全部状态</option><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option>
    </select>
    <select id="fPriority" onchange="render()">
      <option value="">全部优先级</option><option value="high">高</option><option value="mid">中</option><option value="low">低</option>
    </select>
    <select id="fCategory" onchange="render()"><option value="">全部分类</option></select>
    <label>回顾≤ <input type="date" id="fDue" onchange="render()"></label>
    <select id="fSort" onchange="setSortKey(this.value)">
      <option value="due">按回顾日期</option><option value="priority">按优先级</option><option value="title">按标题</option><option value="cust">按客户代码</option><option value="prod">按产品类别</option><option value="po">按客户订单号</option><option value="ipo">按内部订单号</option><option value="desc">按描述</option><option value="category">按分类</option><option value="status">按状态</option><option value="created">按创建时间</option><option value="updated">按最近更新</option>
    </select>
    <button class="btn btn-outline btn-sm" id="btnSortDir" onclick="toggleSortDir()" title="切换升序/降序">↑ 升序</button>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="fGroup" checked onchange="render()">按分类分组</label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="fHideDone" onchange="render()">隐藏已完成</label>
    <button class="btn btn-outline btn-sm" onclick="resetFilters()">重置</button>
  </div>

  <!-- 台账列表 -->
  <div id="ledger"></div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <div class="modal-head"><h3 id="editTitle">新增事务</h3><button class="modal-close" onclick="closeModal('editMask')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>事务大类 <span class="req">*</span></label>
        <div class="cat-chooser">
          <button type="button" class="cat-opt" data-cat="销售订单" onclick="chooseCat('销售订单')">📦 销售订单</button>
          <button type="button" class="cat-opt" data-cat="综合事务" onclick="chooseCat('综合事务')">🗂️ 综合事务</button>
        </div>
      </div>
      <div class="form-group" id="fgTitle"><label>事务 <span class="req">*</span></label><input id="inTitle" maxlength="60" placeholder="例如：订单跟进、报价数据库搭建"></div>
      <div class="ord-fields" id="ordFields">
        <div class="form-row">
          <div class="form-group"><label>客户代码</label><input id="inCust" maxlength="30" placeholder="例如：TX05（没有可留空）"></div>
          <div class="form-group"><label>产品类别</label><input id="inProd" maxlength="20" placeholder="例如：FG / HC / FRP"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>客户订单号</label><input id="inCustPo" maxlength="40" placeholder="例如：DSP31126"></div>
          <div class="form-group"><label>内部订单号 <span class="req">*</span></label><input id="inIntPo" maxlength="40" placeholder="例如：C-SP-W-240900"></div>
        </div>
      </div>
      <div class="form-group"><label>描述</label><textarea id="inDesc" placeholder="补充说明、关键要点…"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>优先级</label>
          <select id="inPriority"><option value="high">🔴 高</option><option value="mid" selected>🟡 中</option><option value="low">🔵 低</option></select>
        </div>
        <div class="form-group"><label>状态</label>
          <select id="inStatus"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select>
        </div>
      </div>
      <div class="form-group"><label>回顾日期</label><input type="date" id="inDue"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('editMask')">取消</button>

<script>
const STATUS_TXT={todo:'待办',doing:'进行中',done:'已完成'};
const PRI_TXT={high:'高',mid:'中',low:'低'};
const PRI_ORDER={high:0,mid:1,low:2};
const STATUS_ORDER={todo:0,doing:1,done:2};
let tasks=[];
let authToken=localStorage.getItem('ledger_token')||null;
let curRole=null;
let backendMode=true;            // 探测到后端API时为true；否则退化为本地单人模式
let editingId=null, detailId=null, statFilter='';
let modalCategory='销售订单';     // 新增/编辑时选中的事务大类（销售订单 / 综合事务）
let sortKey='due', sortDir='asc';

/* ---------- API 层 ---------- */
async function apiReq(p,opts={}){
  const headers={'Content-Type':'application/json'};
  if(authToken) headers['Authorization']='Bearer '+authToken;
  const res=await fetch('/api'+p,{...opts,headers});
  let data=null; try{data=await res.json();}catch(e){}
  if(!res.ok) throw new Error((data&&data.error)||('请求失败 '+res.status));
  return data;
}
const api={
  register:(e,p)=>apiReq('/register',{method:'POST',body:JSON.stringify({email:e,password:p})}),
  login:(e,p)=>apiReq('/login',{method:'POST',body:JSON.stringify({email:e,password:p})}),
  logout:()=>apiReq('/logout',{method:'POST'}),
  me:()=>apiReq('/me'),
  pending:()=>apiReq('/pending'),
  approve:(e)=>apiReq('/approve',{method:'POST',body:JSON.stringify({email:e})}),
  reject:(e)=>apiReq('/reject',{method:'POST',body:JSON.stringify({email:e})}),
  users:()=>apiReq('/users'),
  userOp:(act,e,extra)=>apiReq('/user/'+act,{method:'POST',body:JSON.stringify(Object.assign({email:e},extra||{}))}),
  getTasks:()=>apiReq('/tasks'),
  saveTasks:(arr)=>apiReq('/tasks',{method:'PUT',body:JSON.stringify(arr)}),
};

/* ---------- 持久化（有后端则同步服务端，无后端则本地存储） ---------- */
async function load(){
  if(backendMode){
    try{ const r=await api.getTasks(); tasks=r.tasks||[]; }catch(e){ tasks=[]; toast('加载失败：'+e.message); }
  }else{
    try{ tasks=JSON.parse(localStorage.getItem('ledger_local_tasks'))||[]; }catch(e){ tasks=[]; }
  }
}
function persist(){
  if(backendMode) return api.saveTasks(tasks).catch(e=>toast('保存失败：'+e.message));
  localStorage.setItem('ledger_local_tasks', JSON.stringify(tasks));
}

/* ---------- 工具 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const fmtDT=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dueState(t){
  if(!t.due||t.status==='done')return 'none';
  const today=todayStr();
  if(t.due<today)return 'overdue';
  if(t.due===today)return 'today';
  const diff=(new Date(t.due)-new Date(today))/86400000;
  return diff<=3?'soon':'normal';
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 统计 ---------- */
function renderStats(){
  const c={all:tasks.length,todo:0,doing:0,done:0,soon:0,overdue:0};
  tasks.forEach(t=>{c[t.status]++;const ds=dueState(t);if(ds==='overdue')c.overdue++;else if(ds==='soon'||ds==='today')c.soon++;});
  const defs=[['all','全部事务','c-all'],['todo','待办','c-todo'],['doing','进行中','c-doing'],['done','已完成','c-done'],['soon','临近回顾','c-soon'],['overdue','待回顾','c-overdue']];
  document.getElementById('stats').innerHTML=defs.map(([k,label,cls])=>
    `<div class="stat-card ${cls} ${statFilter===k?'active':''}" onclick="clickStat('${k}')"><div class="num">${c[k]}</div><div class="label">${label}</div></div>`).join('');
}
function clickStat(k){
  statFilter=(statFilter===k||k==='all')?'':k;
  if(k==='done'){const h=document.getElementById('fHideDone');if(h)h.checked=false;}
  render();
}

/* ---------- 订单信息解析（客户代码 / 产品类别 / 客户订单号 / 内部订单号） ---------- */
const RE_TITLE_ORD=/^(.*?)[（(]\s*([^·・]+?)\s*[·・]\s*([^）)]+?)\s*[）)]\s*(.*)$/;
const RE_INT_PO=/^[A-Za-z]+(-[A-Za-z0-9]+){2,}$/;
const RE_CUST_PO=/客户订单号[：:]\s*([^\n\r]+)/;
const _ordCache=new Map();
function orderInfo(t){
  const ck=t.id+'|'+(t.updatedAt||'')+'|'+(t.title||'')+'|'+(t.desc||'');
  const hit=_ordCache.get(ck); if(hit)return hit;
  let cust=(t.custCode||'').trim(), prod=(t.prodType||'').trim(),
      po=(t.custPo||'').trim(), ipo=(t.intPo||'').trim(), name=(t.title||'').trim();
  if(!cust&&!prod&&!po&&!ipo){
    const m=name.match(RE_TITLE_ORD);
    if(m){
      const head=(m[1]||'').trim();
      cust=(m[2]||'').trim(); prod=(m[3]||'').trim();
      name=(m[4]||'').trim()||'订单跟进';
      if(head){ if(RE_INT_PO.test(head)) ipo=head; else po=head; }
    }
    if(!po){ const d=(t.desc||'').match(RE_CUST_PO); if(d) po=d[1].trim(); }
  }
  const o={name,cust,prod,po,ipo};
  _ordCache.set(ck,o); if(_ordCache.size>800)_ordCache.clear();
  return o;
}
/* 客户订单号已单独成列，描述里就不再重复展示 */
function cleanDesc(t){ return (t.desc||'').replace(/客户订单号[：:]\s*[^\n\r]*\r?\n?/,'').trim(); }
function ordCell(v,strong){
  if(!v)return '<span class="ord-none">-</span>';
  return `<span class="${strong?'ord-code':''}">${esc(v)}</span>`;
}

/* ---------- 渲染台账 ---------- */
function matchFilters(t){
  const q=document.getElementById('fSearch').value.trim().toLowerCase();
  if(q){
    const o=orderInfo(t);
    const hay=(t.title+t.desc+t.category+o.cust+o.prod+o.po+o.ipo).toLowerCase();
    if(!hay.includes(q))return false;
  }
  const h=document.getElementById('fHideDone');
  if(h&&h.checked&&t.status==='done')return false;
  const fs=document.getElementById('fStatus').value; if(fs&&t.status!==fs)return false;
  const fp=document.getElementById('fPriority').value; if(fp&&t.priority!==fp)return false;
  const fc=document.getElementById('fCategory').value; if(fc&&t.category!==fc)return false;
  const fd=document.getElementById('fDue').value; if(fd&&(!t.due||t.due>fd))return false;
  if(statFilter==='todo'||statFilter==='doing'||statFilter==='done'){if(t.status!==statFilter)return false;}
  if(statFilter==='soon'){const ds=dueState(t);if(ds!=='soon'&&ds!=='today')return false;}
  if(statFilter==='overdue'&&dueState(t)!=='overdue')return false;
  if(statFilter==='review'){const ds=dueState(t);if(ds!=='overdue'&&ds!=='today')return false;}
  return true;
}
function sortTasks(arr){
  const s=sortKey, dir=sortDir==='asc'?1:-1;
  return arr.slice().sort((a,b)=>{
    let r=0;
    if(s==='priority'){r=PRI_ORDER[a.priority]-PRI_ORDER[b.priority];if(r===0)r=(a.due||'9999').localeCompare(b.due||'9999');}
    else if(s==='title'){r=(orderInfo(a).name||'').localeCompare((orderInfo(b).name||''),'zh');}
    else if(s==='cust'||s==='prod'||s==='po'||s==='ipo'){
      // 空值恒排在最后（无论升降序）
      const va=orderInfo(a)[s]||'', vb=orderInfo(b)[s]||'';
      if(!va&&!vb)r=0; else if(!va)return 1; else if(!vb)return -1;
      else r=va.localeCompare(vb,'zh',{numeric:true});
    }
    else if(s==='desc'){r=cleanDesc(a).localeCompare(cleanDesc(b),'zh');}
    else if(s==='category'){r=(a.category||'').localeCompare((b.category||''),'zh');}
    else if(s==='status'){r=STATUS_ORDER[a.status]-STATUS_ORDER[b.status];}
    else if(s==='created'){r=a.createdAt.localeCompare(b.createdAt);}
    else if(s==='updated'){r=a.updatedAt.localeCompare(b.updatedAt);}
    else {r=(a.due||'9999-99').localeCompare(b.due||'9999-99');}
    return r*dir;
  });
}
function setSortKey(k){ sortKey=k; updateSortDirBtn(); render(); }
function toggleSortDir(){ sortDir=sortDir==='asc'?'desc':'asc'; updateSortDirBtn(); render(); }
function sortBy(k){
  if(sortKey===k){sortDir=sortDir==='asc'?'desc':'asc';}
  else{sortKey=k; sortDir=(k==='created'||k==='updated')?'desc':'asc';}
  const fsEl=document.getElementById('fSort'); if(fsEl)fsEl.value=k;
  updateSortDirBtn(); render();
}
function updateSortDirBtn(){ const b=document.getElementById('btnSortDir'); if(b)b.textContent=sortDir==='asc'?'↑ 升序':'↓ 降序'; }
function cellHTML(t,col,o,dsc,dueTag){
  const AL=col.align==='left'?'left':'center';
  const td=(extra,inner)=>`<td ${extra} style="text-align:${AL}">${inner}</td>`;
  switch(col.k){
    case 'title':   return td('',`<div class="task-title">${esc(o.name)}</div>`);
    case 'cust':    return td('class="ord-cell"',ordCell(o.cust,true));
    case 'prod':    return td('class="ord-cell"',ordCell(o.prod,true));
    case 'po':      return td('class="ord-cell hide-sm"',ordCell(o.po));
    case 'ipo':     return td('class="ord-cell hide-sm"',ordCell(o.ipo));
    case 'desc':    return td('class="hide-sm desc-cell"',dsc?esc(dsc):'<span style="color:#9ca3af">—</span>');
    case 'category':return td('class="hide-sm"',`<span class="cat-badge">${esc(t.category)||'未分类'}</span>`);
    case 'priority':return td('onclick="event.stopPropagation()"',`<span class="pri-badge p-${t.priority}" title="点击切换优先级（当前：${PRI_TXT[t.priority]}）" onclick="cyclePriority('${t.id}')">${{high:'H',mid:'M',low:'L'}[t.priority]}</span>`);
    case 'due': {
      const ds=dueState(t);
      let tag='';
      if(ds==='overdue')tag='<span class="due-tag overdue">待回顾</span>';
      else if(ds==='today')tag='<span class="due-tag today">今日回顾</span>';
      else if(ds==='soon')tag='<span class="due-tag soon">临近回顾</span>';
      const cls=(t.due&&ds==='overdue')?'date-overdue':(t.due&&ds==='today')?'date-today':'';
      return td('class="due-cell" onclick="event.stopPropagation()"',`<input type="date" class="date-input ${cls}" value="${t.due||''}" onchange="quickReview('${t.id}',this.value)" title="点击修改回顾日期">${tag}`);
    }
    case 'status':  return td('onclick="event.stopPropagation()"',`<select class="status-select" onchange="quickStatus('${t.id}',this.value)"><option value="todo" ${t.status==='todo'?'selected':''}>待办</option><option value="doing" ${t.status==='doing'?'selected':''}>进行中</option><option value="done" ${t.status==='done'?'selected':''}>已完成</option></select>`);
    case 'updated': return td('class="hide-sm"',`<span style="color:var(--muted);font-size:12px;white-space:nowrap">${fmtDT(t.updatedAt)}</span>`);
    default:        return td('','');
  }
}
// 每个分组的列定义（顺序即显示顺序）。align:'left' 表示左对齐（例外列），其余默认居中。
function colsForGroup(forGroup){
  if(forGroup==="销售订单"){
    return [
      {k:"ipo",t:"内部订单号",c:"hide-sm"},
      {k:"po",t:"客户订单号",c:"hide-sm"},
      {k:"cust",t:"客户代码",c:""},
      {k:"prod",t:"产品类别",c:""},
      {k:"desc",t:"描述",c:"hide-sm",align:"left"},
      {k:"priority",t:"优先级",c:""},
      {k:"due",t:"回顾日期",c:""},
      {k:"status",t:"状态",c:""},
      {k:"updated",t:"最近更新",c:"hide-sm"}
    ];
  }
  if(forGroup==="综合事务"){
    return [
      {k:"title",t:"事务",c:"",align:"left"},
      {k:"desc",t:"描述",c:"hide-sm",align:"left"},
      {k:"priority",t:"优先级",c:""},
      {k:"due",t:"回顾日期",c:""},
      {k:"status",t:"状态",c:""},
      {k:"updated",t:"最近更新",c:"hide-sm"}
    ];
  }
  return [
    {k:"title",t:"事务",c:"",align:"left"},
    {k:"cust",t:"客户代码",c:"",align:"left"},
    {k:"prod",t:"产品类别",c:"",align:"left"},
    {k:"po",t:"客户订单号",c:"hide-sm",align:"left"},
    {k:"ipo",t:"内部订单号",c:"hide-sm",align:"left"},
    {k:"desc",t:"描述",c:"hide-sm",align:"left"},
    {k:"category",t:"分类",c:"hide-sm",align:"left"},
    {k:"priority",t:"优先级",c:"",align:"left"},
    {k:"due",t:"回顾日期",c:"",align:"left"},
    {k:"status",t:"状态",c:"",align:"left"},
    {k:"updated",t:"最近更新",c:"hide-sm",align:"left"}
  ];
}
function rowHTML(t,forGroup){
  const ds=dueState(t);
  let rowCls=t.status==='done'?'row-done':(ds==='overdue'?'row-overdue':(ds==='soon'||ds==='today')?'row-soon':'');
  let dueTag='';
  if(ds==='overdue')dueTag='<span class="due-tag overdue">已逾期</span>';
  else if(ds==='today')dueTag='<span class="due-tag today">今日截止</span>';
  else if(ds==='soon')dueTag='<span class="due-tag soon">临近截止</span>';
  const o=orderInfo(t), dsc=cleanDesc(t);
  const cols=colsForGroup(forGroup);
  return `<tr class="${rowCls}" onclick="openDetail('${t.id}')">`+cols.map(c=>cellHTML(t,c,o,dsc,dueTag)).join('')+`</tr>`;
}
function tableHead(forGroup){
  const cols=colsForGroup(forGroup);
  return '<thead><tr>'+cols.map(col=>{
    const active=col.k===sortKey;
    const arrow=active?(sortDir==="asc"?" ▲":" ▼"):"";
    return `<th class="${col.c}" style="cursor:pointer;user-select:none;text-align:center" onclick="sortBy('${col.k}')" title="点击切换排序">${col.t}${arrow}</th>`;
  }).join('')+'</tr></thead>';
}
function render(){
  const fsEl=document.getElementById('fSort'); if(fsEl)fsEl.value=sortKey;
  updateSortDirBtn();
  renderStats();
  refreshCategoryOptions();
  const list=sortTasks(tasks.filter(matchFilters));
  const box=document.getElementById('ledger');
  if(!list.length){
    box.innerHTML=`<div class="empty"><div class="icon">🗂️</div>${tasks.length?'没有符合筛选条件的事务':'台账还是空的，点击右上角「新增事务」开始记录吧'}</div>`;
    return;
  }
  if(document.getElementById('fGroup').checked){
    const groups={};
    list.forEach(t=>{const g=t.category||'未分类';(groups[g]=groups[g]||[]).push(t);});
    const CAT_ORDER={"销售订单":0,"综合事务":1};
    box.innerHTML=Object.keys(groups).sort((a,b)=>{
      const oa=CAT_ORDER[a], ob=CAT_ORDER[b];
      if(oa!==undefined && ob!==undefined) return oa-ob;
      if(oa!==undefined) return -1;
      if(ob!==undefined) return 1;
      return a.localeCompare(b,"zh");
    }).map(g=>{
      const arr=groups[g],done=arr.filter(t=>t.status==='done').length;
      return `<div class="group-block">
        <div class="group-header">📁 ${esc(g)} <span class="count">${arr.length}</span><span class="gdone">已完成 ${done}/${arr.length}</span></div>
        <table class="task-table">${tableHead(g)}<tbody>${arr.map(t=>rowHTML(t,g)).join('')}</tbody></table></div>`;
    }).join('');
  }else{
    box.innerHTML=`<table class="task-table">${tableHead()}<tbody>${list.map(rowHTML).join('')}</tbody></table>`;
  }
  renderReminder();
}
function refreshCategoryOptions(){
  const cats=[...new Set(tasks.map(t=>t.category).filter(Boolean))].sort();
  const sel=document.getElementById('fCategory'),cur=sel.value;
  sel.innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
}
function resetFilters(){
  ['fSearch','fDue'].forEach(id=>document.getElementById(id).value='');
  ['fStatus','fPriority','fCategory'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fSort').value='due'; statFilter=''; sortKey='due'; sortDir='asc'; updateSortDirBtn(); render();
}

/* ---------- 新增 / 编辑 ---------- */
function chooseCat(cat){
  modalCategory=cat;
  document.querySelectorAll('#editMask .cat-opt').forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  const isSales=cat==='销售订单';
  document.getElementById('fgTitle').style.display=isSales?'none':'';
  document.getElementById('ordFields').style.display=isSales?'':'none';
}
function openEditModal(id){
  editingId=id||null;
  document.getElementById('editTitle').textContent=id?'编辑事务':'新增事务';
  const t=id?tasks.find(x=>x.id===id):null;
  const o=t?orderInfo(t):{name:'',cust:'',prod:'',po:'',ipo:''};
  const initCat=id?(t&&t.category==='销售订单'?'销售订单':'综合事务'):'销售订单';
  modalCategory=initCat;
  document.querySelectorAll('#editMask .cat-opt').forEach(b=>b.classList.toggle('active', b.dataset.cat===initCat));
  const isSales=initCat==='销售订单';
  document.getElementById('fgTitle').style.display=isSales?'none':'';
  document.getElementById('ordFields').style.display=isSales?'':'none';
  document.getElementById('inTitle').value=t?o.name:'';
  document.getElementById('inCust').value=o.cust||'';
  document.getElementById('inProd').value=o.prod||'';
  document.getElementById('inCustPo').value=o.po||'';
  document.getElementById('inIntPo').value=o.ipo||'';
  document.getElementById('inDesc').value=t?cleanDesc(t):'';
  document.getElementById('inPriority').value=t?t.priority:'mid';
  document.getElementById('inStatus').value=t?t.status:'todo';
  document.getElementById('inDue').value=t?t.due:'';
  document.getElementById('editMask').classList.add('show');
  setTimeout(()=>{ const f=isSales?document.getElementById('inIntPo'):document.getElementById('inTitle'); if(f)f.focus(); },50);
}
function saveTask(){
  const cat=modalCategory, isSales=cat==='销售订单';
  let title, custCode='', prodType='', custPo='', intPo='';
  if(isSales){
    intPo=document.getElementById('inIntPo').value.trim();
    if(!intPo){toast('请填写内部订单号');return;}
    custCode=document.getElementById('inCust').value.trim();
    prodType=document.getElementById('inProd').value.trim();
    custPo=document.getElementById('inCustPo').value.trim();
    title=`${intPo}（${custCode||'—'}·${prodType||'—'}）订单跟进`;
  }else{
    title=document.getElementById('inTitle').value.trim();
    if(!title){toast('请填写事务名称');return;}
  }
  const v={title,custCode,prodType,custPo,intPo,
    desc:document.getElementById('inDesc').value.trim(),
    priority:document.getElementById('inPriority').value,status:document.getElementById('inStatus').value,
    due:document.getElementById('inDue').value,category:cat};
  if(editingId){
    const t=tasks.find(x=>x.id===editingId);
    const changes=[];
    if(t.status!==v.status)changes.push(`状态：${STATUS_TXT[t.status]} → ${STATUS_TXT[v.status]}`);
    if(t.priority!==v.priority)changes.push(`优先级：${PRI_TXT[t.priority]} → ${PRI_TXT[v.priority]}`);
    if(t.due!==v.due)changes.push(`回顾日期：${t.due||'无'} → ${v.due||'无'}`);
    const o0=orderInfo(t);
    if(o0.name!==v.title)changes.push('修改了事务名称');
    if((o0.cust||'')!==v.custCode)changes.push(`客户代码：${o0.cust||'-'} → ${v.custCode||'-'}`);
    if((o0.prod||'')!==v.prodType)changes.push(`产品类别：${o0.prod||'-'} → ${v.prodType||'-'}`);
    if((o0.po||'')!==v.custPo)changes.push(`客户订单号：${o0.po||'-'} → ${v.custPo||'-'}`);
    if((o0.ipo||'')!==v.intPo)changes.push(`内部订单号：${o0.ipo||'-'} → ${v.intPo||'-'}`);
    if(cleanDesc(t)!==v.desc)changes.push('修改了描述');
    if(t.category!==v.category)changes.push(`分类：${t.category||'未分类'} → ${v.category||'未分类'}`);
    Object.assign(t,v,{updatedAt:now()});
    if(changes.length)t.logs.push({time:now(),type:t.status!==v.status?'status':'edit',text:'编辑：'+changes.join('；')});
    toast('已保存修改');
  }else{
    const t={id:uid(),...v,createdAt:now(),updatedAt:now(),
      logs:[{time:now(),type:'create',text:`创建事务（状态：${STATUS_TXT[v.status]}，优先级：${PRI_TXT[v.priority]}${v.due?'，回顾 '+v.due:''}）`}]};
    tasks.push(t);
    toast('已添加新事务');
  }
  persist();closeModal('editMask');render();
}
function quickStatus(id,st){
  const t=tasks.find(x=>x.id===id);
  if(!t||t.status===st)return;
  t.logs.push({time:now(),type:'status',text:`状态变更：${STATUS_TXT[t.status]} → ${STATUS_TXT[st]}`});
  t.status=st;t.updatedAt=now();
  persist();render();toast(`「${orderInfo(t).name}」→ ${STATUS_TXT[st]}`);
}
function quickPriority(id,p){
  const t=tasks.find(x=>x.id===id);
  if(!t||t.priority===p)return;
  t.logs.push({time:now(),type:'edit',text:`优先级变更：${PRI_TXT[t.priority]} → ${PRI_TXT[p]}`});
  t.priority=p;t.updatedAt=now();
  persist();render();toast(`「${orderInfo(t).name}」优先级 → ${PRI_TXT[p]}`);
}
function cyclePriority(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const order=['high','mid','low'];
  const next=order[(order.indexOf(t.priority)+1)%3];
  quickPriority(id,next);
}
function quickReview(id,val){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  val=(val||'').trim();
  if(t.due===val)return;
  const old=t.due||'无';
  t.logs.push({time:now(),type:'edit',text:`回顾日期：${old} → ${val||'无'}`});
  t.due=val;t.updatedAt=now();
  persist();render();toast(val?`回顾日期已设为 ${val}`:'已清除回顾日期');
}
/* ---------- 回顾提醒 ---------- */
function reviewList(){ return tasks.filter(t=>t.status!=='done'&&['overdue','today'].includes(dueState(t))); }
function renderReminder(){
  const n=reviewList().length, el=document.getElementById('remindCount');
  if(el){ el.textContent=n; el.style.display=n?'':'none'; }
}
function openReminders(){
  statFilter=(statFilter==='review')?'':'review';
  render(); requestReviewNotify();
}
function requestReviewNotify(){
  try{
    if(typeof Notification==='undefined')return;
    if(Notification.permission==='granted'){ notifyReviews(); }
    else if(Notification.permission!=='denied'){ Notification.requestPermission().then(p=>{ if(p==='granted')notifyReviews(); }); }
  }catch(e){}
}
function notifyReviews(){
  try{
    if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
    const items=reviewList(); if(!items.length)return;
    const names=items.slice(0,5).map(t=>'• '+orderInfo(t).name+(t.due?'（'+t.due+'）':'')).join('\n');
    new Notification('工作台账 · 待回顾提醒',{body:`有 ${items.length} 项待回顾：\n${names}${items.length>5?'\n…':''}`});
  }catch(e){}
}
function maybeNotifyOnLoad(){ try{ if(typeof Notification!=='undefined'&&Notification.permission==='granted')notifyReviews(); }catch(e){} }

/* ---------- 详情 / 时间轴 ---------- */
function openDetail(id){
  detailId=id;
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const od=orderInfo(t);
  document.getElementById('dTitle').textContent=od.name;
  const ds=dueState(t);
  document.getElementById('dMeta').innerHTML=
    `<span class="badge s-${t.status}"><span class="dot"></span>${STATUS_TXT[t.status]}</span>
     <span class="pri-badge p-${t.priority}" style="vertical-align:middle">${{high:'H',mid:'M',low:'L'}[t.priority]}</span><span style="margin-left:6px">优先级：${PRI_TXT[t.priority]}</span>
     <span class="cat-badge">📁 ${esc(t.category)||'未分类'}</span>
     ${od.cust?`<span class="cat-badge">🏷 客户代码：${esc(od.cust)}</span>`:''}
     ${od.prod?`<span class="cat-badge">📦 产品类别：${esc(od.prod)}</span>`:''}
     ${od.po?`<span class="cat-badge">🧾 客户订单号：${esc(od.po)}</span>`:''}
     ${od.ipo?`<span class="cat-badge">🔖 内部订单号：${esc(od.ipo)}</span>`:''}
     ${t.due?`<span class="cat-badge">📅 回顾 ${t.due} ${ds==='overdue'?'<b style="color:var(--danger)">（待回顾）</b>':ds==='today'?'<b style="color:#f97316">（今日回顾）</b>':ds==='soon'?'<b style="color:var(--warn)">（临近回顾）</b>':''}</span>`:''}
     <span class="cat-badge">🕐 创建于 ${fmtDT(t.createdAt)}</span>`;
  document.getElementById('dDesc').textContent=cleanDesc(t)||'（无描述）';
  renderTimeline(t);
  document.getElementById('dNote').value='';
  document.getElementById('detailMask').classList.add('show');
}
function renderTimeline(t){
  document.getElementById('dTimeline').innerHTML=t.logs.slice().reverse().map(l=>
    `<div class="tl-item tl-${l.type}"><div class="tl-time">${fmtDT(l.time)}</div><div class="tl-text">${esc(l.text)}</div></div>`).join('');
}
function addNote(){
  const v=document.getElementById('dNote').value.trim();
  if(!v||!detailId)return;
  const t=tasks.find(x=>x.id===detailId);
  t.logs.push({time:now(),type:'note',text:'备注：'+v});
  t.updatedAt=now();persist();renderTimeline(t);render();
  document.getElementById('dNote').value='';toast('已记录进展');
}
function editFromDetail(){closeModal('detailMask');openEditModal(detailId);}
function deleteTask(){
  const t=tasks.find(x=>x.id===detailId);
  if(!t)return;
  if(!confirm(`确定删除事务「${orderInfo(t).name}」？此操作不可恢复（建议先导出备份）。`))return;
  tasks=tasks.filter(x=>x.id!==detailId);
  persist();closeModal('detailMask');render();toast('已删除');
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));

/* ---------- 导出 / 导入 ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({exportedAt:now(),tasks},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`工作台账备份_${todayStr()}.json`;
  a.click();URL.revokeObjectURL(a.href);
  toast('已导出 JSON 备份');
}
function importData(ev){
  const file=ev.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const arr=Array.isArray(data)?data:data.tasks;
      if(!Array.isArray(arr))throw 0;
      const mode=tasks.length?confirm('检测到现有台账数据。\n「确定」= 合并导入（跳过重复ID）\n「取消」= 覆盖现有数据'):false;
      if(mode){
        const ids=new Set(tasks.map(t=>t.id));let n=0;
        arr.forEach(t=>{if(t&&t.id&&!ids.has(t.id)){tasks.push(t);n++;}});
        toast(`合并导入 ${n} 条事务`);
      }else{
        tasks=arr;toast(`导入 ${arr.length} 条事务（已覆盖）`);
      }
      persist();render();
    }catch(err){toast('导入失败：文件格式不正确');}
    ev.target.value='';
  };
  reader.readAsText(file);
}

/* ---------- 创始账号审核 ---------- */
async function refreshAuditBadge(){
  if(curRole!=='founder'){ document.getElementById('btnAudit').style.display='none'; return; }
  document.getElementById('btnAudit').style.display='';
  try{
    const r=await api.pending();
    const n=(r.pending||[]).length;
    const b=document.getElementById('auditCount');
    b.textContent=n; b.style.display=n?'':'none';
  }catch(e){}
}
async function openAudit(){
  try{
    const r=await api.pending();
    const list=r.pending||[];
    document.getElementById('auditList').innerHTML = list.length
      ? list.map(a=>`<div class="audit-row"><span>${esc(a.email)}</span><div><button class="btn btn-primary btn-sm" onclick="doApprove('${esc(a.email)}')">通过</button> <button class="btn btn-danger btn-sm" onclick="doReject('${esc(a.email)}')">拒绝</button></div></div>`).join('')
      : '<div class="empty" style="padding:24px">暂无待审核的申请</div>';
  }catch(e){ toast(e.message); }
  document.getElementById('auditMask').classList.add('show');
}
async function doApprove(email){ try{ await api.approve(email); toast('已通过：'+email); openAudit(); refreshAuditBadge(); refreshUsersBtn(); }catch(e){ toast(e.message); } }
async function doReject(email){ try{ await api.reject(email); toast('已拒绝：'+email); openAudit(); refreshAuditBadge(); }catch(e){ toast(e.message); } }

/* ---------- 账号管理（管理者账号） ---------- */
function refreshUsersBtn(){
  document.getElementById('btnUsers').style.display = (curRole==='founder') ? '' : 'none';
}
function umDate(s){
  if(!s) return '—';
  const d=new Date(s); if(isNaN(d)) return '—';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const UM_STATUS={approved:{t:'正常',c:'ok'},pending:{t:'待审核',c:'wait'},suspended:{t:'已停用',c:'stop'}};

async function openUsers(){
  const box=document.getElementById('usersList');
  box.innerHTML='<div class="empty" style="padding:24px">加载中…</div>';
  document.getElementById('usersMask').classList.add('show');
  try{
    const r=await api.users();
    const list=r.users||[];
    const nOk=list.filter(u=>u.status==='approved').length;
    const nWait=list.filter(u=>u.status==='pending').length;
    const nStop=list.filter(u=>u.status==='suspended').length;
    const nOn=list.filter(u=>u.online).length;
    document.getElementById('umSum').innerHTML=
      `<span>账号总数 <b>${list.length}</b></span><span>正常 <b>${nOk}</b></span>`+
      `<span>待审核 <b>${nWait}</b></span><span>已停用 <b>${nStop}</b></span><span>当前在线 <b>${nOn}</b></span>`;

    box.innerHTML = list.length ? `<table class="um-table">
      <thead><tr>
        <th>账号</th><th>角色</th><th>状态</th>
        <th class="um-hide">事项数</th><th class="um-hide">注册时间</th><th class="um-hide">最近登录</th>
        <th style="text-align:right">操作</th>
      </tr></thead><tbody>${list.map(u=>umRow(u)).join('')}</tbody></table>` :
      '<div class="empty" style="padding:24px">暂无账号</div>';
  }catch(e){
    box.innerHTML='<div class="empty" style="padding:24px">加载失败：'+esc(e.message)+'</div>';
  }
}
function umRow(u){
  const st=UM_STATUS[u.status]||{t:u.status,c:'wait'};
  const isFounder=u.role==='founder';
  const em=esc(u.email);
  let ops='';
  if(isFounder){
    ops='<span style="color:var(--muted);font-size:12px">管理者本人</span>';
  }else if(u.status==='pending'){
    ops=`<button class="btn btn-primary btn-sm" onclick="umOp('approve','${em}')">通过</button>`+
        `<button class="btn btn-danger btn-sm" onclick="umOp('delete','${em}')">删除</button>`;
  }else{
    ops = (u.status==='suspended')
      ? `<button class="btn btn-primary btn-sm" onclick="umOp('enable','${em}')">启用</button>`
      : `<button class="btn btn-outline btn-sm" onclick="umOp('suspend','${em}')">停用</button>`;
    if(u.online) ops+=`<button class="btn btn-outline btn-sm" onclick="umOp('kick','${em}')">强制下线</button>`;
    ops+=`<button class="btn btn-outline btn-sm" onclick="umOp('resetpwd','${em}')">重置密码</button>`+
         `<button class="btn btn-danger btn-sm" onclick="umOp('delete','${em}')">删除</button>`;
  }
  return `<tr>
    <td class="um-mail">${em} ${u.online?'<span class="um-tag online">在线</span>':''}</td>
    <td><span class="um-tag ${isFounder?'founder':'user'}">${isFounder?'管理者':'普通用户'}</span></td>
    <td><span class="um-tag ${st.c}">${st.t}</span></td>
    <td class="um-hide">${u.taskCount}</td>
    <td class="um-hide">${umDate(u.createdAt)}</td>
    <td class="um-hide">${umDate(u.lastLoginAt)}</td>
    <td><div class="um-ops">${ops}</div></td>
  </tr>`;
}
async function umOp(action,email){
  try{
    if(action==='approve'){
      await api.approve(email); toast('已通过：'+email);
    }else if(action==='delete'){
      if(!confirm(`确定删除账号 ${email} 吗？\n该账号名下的所有事项数据将一并永久删除，无法恢复。`)) return;
      await api.userOp('delete',email); toast('已删除：'+email);
    }else if(action==='resetpwd'){
      const np=prompt(`为 ${email} 设置新密码（6 位或以上数字）：`,'');
      if(np===null) return;
      if(!/^\d{6,}$/.test(np)){ toast('密码须为 6 位或以上数字'); return; }
      await api.userOp('resetpwd',email,{password:np});
      toast('密码已重置，该账号需重新登录');
    }else if(action==='suspend'){
      if(!confirm(`确定停用 ${email} 吗？\n停用后该账号将无法登录，数据保留，可随时启用。`)) return;
      await api.userOp('suspend',email); toast('已停用：'+email);
    }else if(action==='enable'){
      await api.userOp('enable',email); toast('已启用：'+email);
    }else if(action==='kick'){
      await api.userOp('kick',email); toast('已强制下线：'+email);
    }
    openUsers(); refreshAuditBadge();
  }catch(e){ toast(e.message); }
}

/* ---------- 账号系统 ---------- */
async function doLogin(){
  const e=document.getElementById('lgEmail').value.trim();
  const p=document.getElementById('lgPwd').value;
  if(!e||!p){toast('请输入账号和密码');return;}
  try{
    const r=await api.login(e,p);
    authToken=r.token; localStorage.setItem('ledger_token',authToken); curRole=r.role;
    document.getElementById('lgErr').textContent='';
    await afterLogin(e);
  }catch(err){ document.getElementById('lgErr').textContent=err.message; }
}
async function doRegister(){
  const e=document.getElementById('lgEmail').value.trim();
  const p=document.getElementById('lgPwd').value;
  if(!e||!p){toast('请输入账号和密码');return;}
  try{
    const r=await api.register(e,p);
    if(r.pending){
      document.getElementById('lgErr').textContent='';
      toast(r.msg||'注册申请已提交，等待审核');
      document.getElementById('lgPwd').value='';
    }else if(r.ok&&r.token){
      authToken=r.token; localStorage.setItem('ledger_token',authToken); curRole=r.role;
      await afterLogin(e);
    }
  }catch(err){ document.getElementById('lgErr').textContent=err.message; }
}
async function afterLogin(e){
  document.getElementById('loginMask').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('curUser').textContent=e;
  await load(); render(); refreshAuditBadge(); refreshUsersBtn();
}
async function logout(){
  try{ await api.logout(); }catch(e){}
  authToken=null; curRole=null; tasks=[]; localStorage.removeItem('ledger_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginMask').classList.remove('hidden');
  document.getElementById('lgEmail').value=''; document.getElementById('lgPwd').value=''; document.getElementById('lgErr').textContent='';
}

/* ---------- 初始化 ---------- */
function enterLocalMode(){
  backendMode=false;
  document.getElementById('loginMask').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('btnAudit').style.display='none';
  document.getElementById('btnUsers').style.display='none';
  document.getElementById('curUser').textContent='本地预览';
  load().then(()=>{render();maybeNotifyOnLoad();});
  toast('当前为本地预览模式：数据仅保存在本浏览器');
}
async function init(){
  if(authToken){
    try{
      const r=await api.me();
      curRole=r.role;
      document.getElementById('loginMask').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('curUser').textContent=r.email;
      await load(); render(); refreshAuditBadge(); refreshUsersBtn(); maybeNotifyOnLoad();
      return;
    }catch(e){ authToken=null; localStorage.removeItem('ledger_token'); }
  }
  // 探测后端是否可用：后端返回 JSON，静态托管返回 HTML
  try{
    const probe=await fetch('/api/me',{headers:{'Content-Type':'application/json'}});
    backendMode=(probe.headers.get('content-type')||'').includes('application/json');
  }catch(e){ backendMode=false; }
  if(backendMode){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginMask').classList.remove('hidden');
  }else{
    enterLocalMode();
  }
}
init();
</script>
